[project]
name = "strategic-topography-cz"
version = "0.1.0"
description = "Episode 2 of Brand Reflection Series — where Czech brands stand and which trends move around them. Multilingual semantic embedding + UMAP."
authors = [{ name = "Barbora Šandová" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "trafilatura>=2.0.0",
    "pytrends>=4.9.2",
    "sentence-transformers>=3.0.0",
    "umap-learn>=0.5.6",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "tenacity>=8.5.0",
    "requests>=2.32.0",
    "Pillow>=10.0.0",
    "torch>=2.2.0",
    "beautifulsoup4>=4.14.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "TID"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
