# Manual fallback for pytrends. Hand-curated based on what's currently
# moving on trends.google.com/trends/trendingsearches/daily?geo=CZ and
# adjacent commercial queries. Refresh every few weeks; replaces pytrends
# output entirely when set.
#
# Velocity is a rough relative score (50-300). The exact number matters
# less than the rank ordering — the renderer sorts by velocity * (1 - saturation).

trends:
  # --- Tech & AI ---
  - { query: "umělá inteligence",        velocity: 280, source: "manual:tech" }
  - { query: "chatgpt česky",            velocity: 240, source: "manual:tech" }
  - { query: "ai generátor obrázků",     velocity: 180, source: "manual:tech" }
  - { query: "kybernetická bezpečnost",  velocity: 150, source: "manual:tech" }

