# Observations from reading the actual map + opportunity table.
# Each ≤60 words. Pattern + interpretation. Specific brand names.

insights:
  - title: >-
      Czech corporate-legacy brands share one homepage register.
    body: >-
      All five banks (ČSOB, Česká spořitelna, Fio, Air Bank, Komerční)
      plus Generali, ČEZ and Škoda Auto cluster as one. The boundary
      isn't sector. It's "established Czech institution" — formal,
      trust-anchored, heritage-leaning. A bank's homepage and an energy
      utility's homepage are closer to each other than a bank's is to
      a fintech challenger that hasn't shipped yet.

  - title: >-
      The mass-market consumer cluster is a templating problem.
    body: >-
      Nine brands across six sectors — Lidl, Albert, Rohlík (retail),
      McDonald's, KFC (QSR), Kofola (beverage), Pilulka (pharma),
      Seznam.cz (media), Avast (tech) — cluster together. They share
      one homepage TEMPLATE: short positioning line on top, product
      grid below, "akce / novinky / aktuální nabídka". The buyer who
      lands on any of these reads the same shape first.

  - title: >-
      Telecoms own a tight, isolated cluster of three.
    body: >-
      T-Mobile, O2 and Vodafone embed close to each other and far from
      every other brand. The "always-on connectivity / esim / mobilní
      tarif" language is differentiated enough to be its own neighborhood
      but homogeneous enough that the three competitors are essentially
      interchangeable. A new entrant could occupy any direction outside
      this cluster.

  - title: >-
      Most rising trends sit in semantic territory at least one brand
      already occupies.
    body: >-
      Of 26 trending queries, none find genuinely empty quadrants.
      The opportunity table flags about a quarter of rows as
      "low signal" — queries whose top three brand matches are within
      0.025 cosine of each other. That's not white space; that's the
      embedding model telling you no brand has staked any chromatic
      ground in that conceptual neighborhood yet.
