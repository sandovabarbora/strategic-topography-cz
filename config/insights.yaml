# Patterns + playbook. Same structure as color / sound projects.
# Each pattern: cross-cutting finding + brand examples + 'why it matters' takeaway.
# Each playbook move: imperative, actionable, executable on next pitch.

patterns:
  - title: >-
      One institutional brand wearing eight logos.
    evidence: >-
      All five Czech banks (ČSOB, Česká spořitelna, Fio, Air Bank,
      Komerční), plus Generali, plus ČEZ, plus Škoda Auto cluster as
      one semantic neighborhood. Eight brands, four sectors (banking,
      insurance, energy, automotive), one homepage register. The
      boundary lines we draw between these brands at the campaign
      level do not survive the homepage layer.
    takeaway: >-
      "Established Czech institution" is a brand template, not a
      sector. A challenger that wants to feel distinct from Czech
      spořitelna has to break out of the institutional template, not
      out of the banking sector. A bank that wants to feel different
      from ČEZ has the same problem.

  - title: >-
      The mass-market cluster is a homepage-shape problem.
    evidence: >-
      Nine brands across six sectors — Lidl, Albert, Rohlík (retail),
      McDonald's, KFC (QSR), Kofola (beverage), Pilulka (pharma),
      Seznam.cz (media), Avast (tech) — cluster together. They share
      one homepage TEMPLATE: short positioning line on top, product
      grid below, "akce / novinky / aktuální nabídka" everywhere.
      Avast (security software) lands in this cluster because their
      homepage looks like a supermarket aisle.
    takeaway: >-
      The buyer who lands on any of these reads the same shape first.
      The campaign creative might be distinctive; the homepage is
      not. A brand that runs distinctive campaigns onto a generic
      homepage trains buyers to forget the distinctive part on contact.

  - title: >-
      Telecoms own a tight, isolated cluster of three.
    evidence: >-
      T-Mobile, O2 and Vodafone embed close to each other and far
      from every other brand. The "always-on connectivity / esim /
      mobilní tarif" language is differentiated enough to be its own
      neighborhood but homogeneous enough that the three competitors
      are essentially interchangeable inside it.
    takeaway: >-
      No fourth brand can join the telecom cluster without becoming
      the fourth-best telecom. A new entrant could occupy any
      direction outside this cluster (a telecom that reads as a
      lifestyle brand, a productivity brand, a cultural brand). The
      cluster boundary itself is the strategic opportunity.

  - title: >-
      The cluster boundary IS the strategic decision boundary.
    evidence: >-
      The most distinctive Czech brands sit close to a cluster
      boundary, not at a cluster centroid. Air Bank holds the
      institutional cluster but barely — its language tilts toward
      consumer. Pilsner Urquell holds the food &amp; beverage cluster
      but tilts toward heritage / luxury. Strong brands are
      cluster-edge brands; safe brands are cluster-center brands.
    takeaway: >-
      "Which competitor do we want to look like" is the wrong
      question. The right question is "which cluster do we want to
      leave." Most brand strategies adjust within-cluster (Air Bank
      vs Komerční); the bigger move is between-cluster (Air Bank
      vs Avast vs Albert).

playbook:
  - title: >-
      Score the client's homepage before writing the brief.
    body: >-
      Run the client URL through the same pipeline as Episode 2.
      If they're in the mass-market cluster, every campaign starts
      with the same handicap: the homepage trains buyers to expect
      a promo template. If they're in the institutional cluster,
      campaign creative has to actively pull buyers out of "Czech
      legacy institution" framing.

  - title: >-
      Identify your cluster's defining vocabulary, then refuse to use it.
    body: >-
      Each cluster has a TF-IDF token signature ("akce / novinky /
      magazín / leták" for mass-market; "bankou / silnější /
      partnerem" for institutional). A brief that wants to escape
      its cluster lists those tokens explicitly and rules them out.
      Cluster escape is a word-level constraint, not just a creative
      ambition.

  - title: >-
      Position against cluster boundaries, not against named competitors.
    body: >-
      A pitch slide showing "we differ from Komerční banka because
      X" is intra-cluster wallpaper change. A pitch slide showing
      "we will move from the institutional cluster toward the
      consumer cluster, here's the homepage shape we'll adopt" is
      a real positioning move. Re-score after the rebrand. If the
      homepage didn't move clusters, neither did the brand.

  - title: >-
      Use Brief Generator for category-specific numerical targets.
    body: >-
      The map tells you where the cluster sits. The
      <a href="https://sandovabarbora.github.io/spot-scorer/">Spot
      Scorer's Brief Generator</a> tells you the numerical targets
      a distinctive spot in that sector needs to hit. Topography
      identifies the trap; the brief generator gives the spec for
      breaking out of it.

  - title: >-
      Read trends through the cluster lens, not the brand lens.
    body: >-
      A rising query that lands inside an empty zone of the map is
      a real opening for the brand whose cluster boundary touches
      that zone. A rising query that lands inside a dense cluster
      is an opportunity only for the brand willing to break the
      cluster's vocabulary. Saturation score in the opportunity
      table is the diagnostic.
