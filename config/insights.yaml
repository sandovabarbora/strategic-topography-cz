# Observations from reading the actual map + opportunity table.
# Each ≤60 words. Pattern + interpretation. Specific brand names.

insights:
  - title: >-
      Czech financial services has one voice.
    body: >-
      All five banks in the corpus (ČSOB, Česká spořitelna, Fio, Air Bank,
      Komerční banka) plus Generali cluster as one. Incumbents and
      challengers are indistinguishable at the homepage layer. Air Bank's
      "different bank" positioning vanishes the moment the homepage opens.
      A new financial entrant doesn't need a better product to look
      distinctive; it needs a different homepage.

  - title: >-
      The mass-market consumer cluster is a templating problem.
    body: >-
      Lidl, Albert, Rohlík, Staropramen, Škoda Auto, Pilulka and
      Seznam.cz sit in one cluster across five sectors. The shared
      shape is the homepage template: carousel of week's promos,
      "akce" headlines, product grid. The semantic distance between
      a discount grocer and an online pharmacy dissolves at the layer
      buyers actually see first.

  - title: >-
      Telecom's real competitive set is broader than telecom.
    body: >-
      T-Mobile, O2 and Vodafone cluster with ČEZ (energy) and Avast
      (security). All five sell "always-on service" — uptime, reliability,
      bundled tariff language. To escape the cluster a telco has to
      break the always-on grammar, not out-feature the other two
      operators.

  - title: >-
      There is no clean strategic white space, only degrees of crowding.
    body: >-
      Every trend in the corpus has a top-3-brand saturation above 0.74
      — most sit at 0.80+. The least-crowded queries (voyo program,
      fotovoltaika dotace, vitamíny d3) are also the lowest-velocity.
      The classic "high momentum + low saturation" jackpot quadrant is
      empty here, which is itself a finding: Czech brand homepages
      have already absorbed the language of every trending topic.
